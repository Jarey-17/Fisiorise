<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda — Dra. Dina Reyes</title>
    <link rel="icon" type="image/svg+xml" href="./assets/images/ISOTIPO-578045.svg" />
    <link rel="stylesheet" href="./styles/main.css" />
</head>

<body class="pos-page">

    <!-- HEADER POS -->
    <header class="pos-header">
        <div class="pos-header__inner">
            <a href="index.html" class="pos-header__back">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Inicio
            </a>
            <span class="pos-header__title">🛒 Tienda Fisiorise</span>
            <img src="./assets/images/ISOTIPO-578045.svg" alt="Logo" style="height:2.5rem; width:auto;" />
        </div>
    </header>

    <!-- MAIN POS -->
    <div class="pos-main">

        <!-- CATÁLOGO -->
        <div class="pos-catalog">
            <input type="text" id="pos-search" class="pos-catalog__search" placeholder="🔍 Buscar producto..." />

            <div class="pos-catalog__tabs" id="pos-tabs">
                <button class="pos-tab active" data-cat="todos">Todos</button>
                <button class="pos-tab" data-cat="ebooks">E-books</button>
                <button class="pos-tab" data-cat="equipos">Equipos</button>
                <button class="pos-tab" data-cat="suplementos">Suplementos</button>
                <button class="pos-tab" data-cat="accesorios">Accesorios</button>
            </div>

            <div class="pos-products" id="pos-products"></div>
        </div>

        <!-- CARRITO -->
        <div class="pos-cart">
            <div class="pos-cart__header">
                <span class="pos-cart__title">Venta actual</span>
                <span class="pos-cart__count" id="cart-count">0</span>
            </div>

            <div class="pos-cart__items" id="cart-items">
                <p class="pos-cart__empty">Agrega productos para comenzar</p>
            </div>

            <div class="pos-cart__summary">
                <div class="pos-cart__row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">C$ 0.00</span>
                </div>
                <div class="pos-cart__row">
                    <span>IVA (15%)</span>
                    <span id="cart-tax">C$ 0.00</span>
                </div>
                <div class="pos-cart__row pos-cart__row--total">
                    <span>Total</span>
                    <span id="cart-total">C$ 0.00</span>
                </div>
            </div>

            <div class="pos-cart__actions">
                <p style="font-size:.8125rem;font-weight:600;color:#64748b;margin-bottom:.25rem;">Método de pago</p>
                <div class="pos-payment-methods" id="payment-methods">
                    <button class="pos-pay-btn selected" data-method="efectivo">
                        <span class="pos-pay-btn__icon">💵</span>Efectivo
                    </button>
                    <button class="pos-pay-btn" data-method="tarjeta">
                        <span class="pos-pay-btn__icon">💳</span>Tarjeta
                    </button>
                    <button class="pos-pay-btn" data-method="transferencia">
                        <span class="pos-pay-btn__icon">📱</span>Transferencia
                    </button>
                </div>

                <button class="btn btn--primary btn--full" id="checkout-btn" disabled>
                    Cobrar
                </button>
                <span class="pos-clear-btn" id="clear-cart">Vaciar carrito</span>
            </div>
        </div>
    </div>

    <!-- MODAL RECIBO -->
    <div class="pos-modal-overlay" id="receipt-modal">
        <div class="pos-modal">
            <div class="pos-modal__icon">✅</div>
            <h2 class="pos-modal__title">¡Venta exitosa!</h2>
            <p class="pos-modal__subtitle" id="modal-payment-label">Pago recibido en efectivo</p>
            <div class="pos-receipt" id="modal-receipt"></div>
            <button class="btn btn--primary btn--full" id="modal-close">Nueva venta</button>
        </div>
    </div>

    <script>
        // ── CATÁLOGO DE PRODUCTOS ──────────────────────────────────────
        const PRODUCTS = [
            // E-books
            { id: 1, name: "Guía Estrés Físico y Cervical", cat: "ebooks", price: 0, emoji: "📗", stock: 999 },
            { id: 2, name: "Tips de Habla y Estimulación Temprana", cat: "ebooks", price: 0, emoji: "📘", stock: 999 },
            { id: 3, name: "Pausas Activas en la Oficina", cat: "ebooks", price: 150, emoji: "📙", stock: 999 },
            { id: 4, name: "Plan de Rehabilitación Neurológica", cat: "ebooks", price: 250, emoji: "📕", stock: 999 },
            // Equipos
            { id: 5, name: "Banda Elástica de Resistencia (set x3)", cat: "equipos", price: 320, emoji: "🎽", stock: 15 },
            { id: 6, name: "Rodillo de Espuma (Foam Roller)", cat: "equipos", price: 580, emoji: "🟦", stock: 8 },
            { id: 7, name: "Pelota de Terapia 65cm", cat: "equipos", price: 750, emoji: "🏐", stock: 5 },
            { id: 8, name: "TENS Portatil (electroestimulador)", cat: "equipos", price: 2400, emoji: "⚡", stock: 3 },
            // Suplementos
            { id: 9, name: "Colágeno Hidrolizado 300g", cat: "suplementos", price: 450, emoji: "💊", stock: 20 },
            { id: 10, name: "Magnesio Complex (60 cáps)", cat: "suplementos", price: 360, emoji: "🧴", stock: 12 },
            { id: 11, name: "Omega-3 Premium (90 cáps)", cat: "suplementos", price: 520, emoji: "🐟", stock: 10 },
            { id: 12, name: "Vitamina D3 + K2 (60 cáps)", cat: "suplementos", price: 290, emoji: "☀️", stock: 18 },
            // Accesorios
            { id: 13, name: "Gel Frío/Calor Reutilizable", cat: "accesorios", price: 180, emoji: "🧊", stock: 25 },
            { id: 14, name: "Muñequera de Soporte", cat: "accesorios", price: 220, emoji: "🤝", stock: 14 },
            { id: 15, name: "Rodillera Funcional", cat: "accesorios", price: 380, emoji: "🦵", stock: 9 },
            { id: 16, name: "Cojín Lumbar Ergonómico", cat: "accesorios", price: 490, emoji: "🪑", stock: 6 },
        ];

        // ── ESTADO ─────────────────────────────────────────────────────
        let cart = [];
        let activeCategory = "todos";
        let searchQuery = "";
        let paymentMethod = "efectivo";

        // ── REFERENCIAS DOM ────────────────────────────────────────────
        const productsEl = document.getElementById("pos-products");
        const cartItemsEl = document.getElementById("cart-items");
        const cartCountEl = document.getElementById("cart-count");
        const cartSubtotalEl = document.getElementById("cart-subtotal");
        const cartTaxEl = document.getElementById("cart-tax");
        const cartTotalEl = document.getElementById("cart-total");
        const checkoutBtn = document.getElementById("checkout-btn");
        const clearCartBtn = document.getElementById("clear-cart");
        const receiptModal = document.getElementById("receipt-modal");
        const modalReceipt = document.getElementById("modal-receipt");
        const modalPaymentLabel = document.getElementById("modal-payment-label");
        const modalClose = document.getElementById("modal-close");

        // ── RENDER PRODUCTOS ───────────────────────────────────────────
        function renderProducts() {
            const filtered = PRODUCTS.filter(p => {
                const matchesCat = activeCategory === "todos" || p.cat === activeCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            productsEl.innerHTML = filtered.length === 0
                ? `<p style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:2rem;">Sin resultados</p>`
                : filtered.map(p => `
                    <div class="pos-product-card" onclick="addToCart(${p.id})">
                        <div class="pos-product-card__emoji">${p.emoji}</div>
                        <div class="pos-product-card__name">${p.name}</div>
                        <div class="pos-product-card__price">${p.price === 0 ? "Gratis" : "C$ " + p.price.toFixed(2)}</div>
                        <div class="pos-product-card__stock">${p.cat === "ebooks" ? "Digital" : "Stock: " + p.stock}</div>
                    </div>
                `).join("");
        }

        // ── CARRITO ────────────────────────────────────────────────────
        function addToCart(productId) {
            const product = PRODUCTS.find(p => p.id === productId);
            const existing = cart.find(i => i.id === productId);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        }

        function updateQty(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) cart = cart.filter(i => i.id !== productId);
            renderCart();
        }

        function renderCart() {
            const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
            const tax = total * 0.15;
            const grand = total + tax;

            cartCountEl.textContent = cart.reduce((s, i) => s + i.qty, 0);
            cartSubtotalEl.textContent = "C$ " + total.toFixed(2);
            cartTaxEl.textContent = "C$ " + tax.toFixed(2);
            cartTotalEl.textContent = "C$ " + grand.toFixed(2);
            checkoutBtn.disabled = cart.length === 0;

            if (cart.length === 0) {
                cartItemsEl.innerHTML = `<p class="pos-cart__empty">Agrega productos para comenzar</p>`;
                return;
            }

            cartItemsEl.innerHTML = cart.map(item => `
                <div class="pos-cart-item">
                    <span class="pos-cart-item__emoji">${item.emoji}</span>
                    <div class="pos-cart-item__info">
                        <div class="pos-cart-item__name">${item.name}</div>
                        <div class="pos-cart-item__price">${item.price === 0 ? "Gratis" : "C$ " + (item.price * item.qty).toFixed(2)}</div>
                    </div>
                    <div class="pos-cart-item__qty">
                        <button class="pos-qty-btn" onclick="updateQty(${item.id}, -1)">−</button>
                        <span class="pos-qty-num">${item.qty}</span>
                        <button class="pos-qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                    </div>
                </div>
            `).join("");
        }

        // ── CHECKOUT ───────────────────────────────────────────────────
        const methodLabels = {
            efectivo: "Pago recibido en efectivo 💵",
            tarjeta: "Pago con tarjeta procesado 💳",
            transferencia: "Transferencia confirmada 📱"
        };

        checkoutBtn.addEventListener("click", () => {
            const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
            const tax = total * 0.15;
            const grand = total + tax;

            const now = new Date();
            const dateStr = now.toLocaleDateString("es-NI", { day: "2-digit", month: "short", year: "numeric" });
            const timeStr = now.toLocaleTimeString("es-NI", { hour: "2-digit", minute: "2-digit" });

            modalPaymentLabel.textContent = methodLabels[paymentMethod];
            modalReceipt.innerHTML = `
                <div class="pos-receipt__row"><span>Fecha</span><span>${dateStr} ${timeStr}</span></div>
                <div class="pos-receipt__row"><span>Método</span><span style="text-transform:capitalize">${paymentMethod}</span></div>
                <hr style="border:none;border-top:1px solid #e2e8f0;margin:.5rem 0">
                ${cart.map(i => `
                    <div class="pos-receipt__row">
                        <span>${i.emoji} ${i.name} x${i.qty}</span>
                        <span>${i.price === 0 ? "Gratis" : "C$ " + (i.price * i.qty).toFixed(2)}</span>
                    </div>
                `).join("")}
                <div class="pos-receipt__row pos-receipt__total">
                    <span>Total pagado</span>
                    <span>C$ ${grand.toFixed(2)}</span>
                </div>
            `;
            receiptModal.classList.add("open");
        });

        modalClose.addEventListener("click", () => {
            cart = [];
            renderCart();
            receiptModal.classList.remove("open");
        });

        receiptModal.addEventListener("click", (e) => {
            if (e.target === receiptModal) receiptModal.classList.remove("open");
        });

        clearCartBtn.addEventListener("click", () => { cart = []; renderCart(); });

        // ── FILTROS ────────────────────────────────────────────────────
        document.getElementById("pos-tabs").addEventListener("click", (e) => {
            const btn = e.target.closest(".pos-tab");
            if (!btn) return;
            document.querySelectorAll(".pos-tab").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            activeCategory = btn.dataset.cat;
            renderProducts();
        });

        document.getElementById("pos-search").addEventListener("input", (e) => {
            searchQuery = e.target.value;
            renderProducts();
        });

        document.getElementById("payment-methods").addEventListener("click", (e) => {
            const btn = e.target.closest(".pos-pay-btn");
            if (!btn) return;
            document.querySelectorAll(".pos-pay-btn").forEach(b => b.classList.remove("selected"));
            btn.classList.add("selected");
            paymentMethod = btn.dataset.method;
        });

        // ── INIT ───────────────────────────────────────────────────────
        renderProducts();
        renderCart();

        // ── TRANSICIÓN SUAVE ENTRE PÁGINAS ────────────────────────────
        document.body.style.transition = 'opacity .35s ease';
        document.body.style.opacity = '0';
        window.addEventListener('load', () => { document.body.style.opacity = '1'; });
        document.querySelectorAll('a[href]').forEach(link => {
            const href = link.getAttribute('href');
            if (!href.startsWith('#') && !href.startsWith('http') && !href.startsWith('mailto')) {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.body.style.opacity = '0';
                    setTimeout(() => { window.location.href = href; }, 340);
                });
            }
        });
    </script>
</body>

</html>
